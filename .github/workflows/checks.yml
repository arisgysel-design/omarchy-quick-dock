name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Manifest is valid JSON
        run: jq -e '.schemaVersion == 1 and (.id | length > 0) and (.entryPoints.menu | length > 0)' manifest.json
      - name: Shell syntax
        run: bash -n bin/quick-dock-close
      - name: ShellCheck
        run: shellcheck bin/quick-dock-close
      - name: Tests
        run: node --test tests/*.test.mjs
